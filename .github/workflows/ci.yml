name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: test-cross
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages (C compiler, Qt runtime libs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc gcc-multilib gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils gdb gdbserver clang lld llvm libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e '.[dev]'
      # ARM / AArch64 samples built by the cross job: the recompile harness runs their
      # pseudocode here, where the host -m32 toolchain is
      - uses: actions/download-artifact@v4
        with:
          name: cross-samples
          path: tests/bins
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs

  # Windows (PE) debugging: wine runs Windows' own gdbserver.exe (from gdb-mingw-w64-target)
  test-wine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System packages (wine, MinGW, Windows gdbserver)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 gdb gdb-mingw-w64-target
          sudo apt-get install -y -q --no-install-recommends wine wine64 wine32:i386 || sudo apt-get install -y -q --no-install-recommends wine wine64
          ls /usr/share/win64/gdbserver.exe /usr/share/win32/gdbserver.exe
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test (Windows programs under wine)
        run: pytest -q -rs tests/test_debug_targets.py -k wine

  # the ARM cross compilers cannot be installed next to gcc-multilib on the runner image,
  # so the ARM / AArch64 samples are built (and their own tests run) in a job of their own
  test-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System packages (ARM / AArch64 / MIPS / RISC-V / PowerPC cross compilers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc binutils
          sudo apt-get install -y -q gcc-aarch64-linux-gnu || sudo apt-get install -y -q gcc-14-aarch64-linux-gnu
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf || sudo apt-get install -y -q gcc-14-arm-linux-gnueabihf
          sudo apt-get install -y -q gcc-mipsel-linux-gnu || sudo apt-get install -y -q gcc-14-mipsel-linux-gnu
          sudo apt-get install -y -q gcc-mips-linux-gnu gcc-mips64el-linux-gnuabi64 || true
          sudo apt-get install -y -q gcc-powerpc-linux-gnu gcc-powerpc64le-linux-gnu || true
          sudo apt-get install -y -q gcc-riscv64-linux-gnu || sudo apt-get install -y -q gcc-14-riscv64-linux-gnu
          sudo apt-get install -y -q qemu-user        # runs the recompiled MIPS / AArch64 / ARM / RISC-V pseudocode
          sudo apt-get install -y -q gdb-multiarch    # debugs them under qemu-user's gdb stub
          ls /usr/bin/aarch64-linux-gnu-gcc* /usr/bin/arm-linux-gnueabihf-gcc*
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test (ARM / AArch64 / MIPS / RISC-V / PowerPC samples)
        run: |
          pytest -q -rs tests/test_arm64.py tests/test_arm.py tests/test_mips.py tests/test_riscv.py tests/test_ppc.py
          pytest -q -rs tests/test_flow.py -k "a64 or arm or thumb or mips or rv64 or rv32 or ppc"
          pytest -q -rs tests/test_floats.py -k "a64 or arm or thumb or rv64 or rv32 or ppc"
          pytest -q -rs tests/test_libsigs.py -k cross
          pytest -q -rs tests/test_autoanalysis.py -k cross
          pytest -q -rs tests/test_debug_targets.py -k qemu
      - uses: actions/upload-artifact@v4
        with:
          name: cross-samples
          path: |
            tests/bins/*a64*.out
            tests/bins/*arm*.out
            tests/bins/*thumb*.out
            tests/bins/*mips*.out
            tests/bins/*rv64*.out
