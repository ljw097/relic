name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages (C compiler, Qt runtime libs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc binutils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs
