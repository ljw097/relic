name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: test-cross
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages (C compiler, Qt runtime libs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc gcc-multilib gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils gdb libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e '.[dev]'
      # ARM / AArch64 samples built by the cross job: the recompile harness runs their
      # pseudocode here, where the host -m32 toolchain is
      - uses: actions/download-artifact@v4
        with:
          name: cross-samples
          path: tests/bins
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs

  # the ARM cross compilers cannot be installed next to gcc-multilib on the runner image,
  # so the ARM / AArch64 samples are built (and their own tests run) in a job of their own
  test-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System packages (ARM / AArch64 / MIPS cross compilers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc binutils
          sudo apt-get install -y -q gcc-aarch64-linux-gnu || sudo apt-get install -y -q gcc-14-aarch64-linux-gnu
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf || sudo apt-get install -y -q gcc-14-arm-linux-gnueabihf
          sudo apt-get install -y -q gcc-mipsel-linux-gnu || sudo apt-get install -y -q gcc-14-mipsel-linux-gnu
          sudo apt-get install -y -q qemu-user        # runs the recompiled MIPS pseudocode
          ls /usr/bin/aarch64-linux-gnu-gcc* /usr/bin/arm-linux-gnueabihf-gcc*
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test (ARM / AArch64 / MIPS samples)
        run: |
          pytest -q -rs tests/test_arm64.py tests/test_arm.py tests/test_mips.py
          pytest -q -rs tests/test_flow.py -k "a64 or arm or thumb or mips"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-samples
          path: |
            tests/bins/*a64*.out
            tests/bins/*arm*.out
            tests/bins/*thumb*.out
            tests/bins/*mips*.out
