name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages (C compiler, Qt runtime libs)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc gcc-multilib gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -rs

  # the AArch64 cross compiler cannot be installed next to gcc-multilib on the runner image,
  # so the AArch64 samples get a job of their own
  test-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System packages (AArch64 cross compiler)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc binutils
          sudo apt-get install -y -q gcc-aarch64-linux-gnu || sudo apt-get install -y -q gcc-14-aarch64-linux-gnu
          ls /usr/bin/aarch64-linux-gnu-gcc*
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test (AArch64 samples)
        run: |
          pytest -q -rs tests/test_arm64.py
          pytest -q -rs tests/test_flow.py -k a64
