name: Release

# Run by hand (Actions ▸ Release ▸ Run workflow) on main: checks that the version matches the
# package, builds the sdist and wheel, smoke-tests the wheel, tags v<version> and publishes a
# GitHub release with docs/releases/<version>.md as its notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (must equal pyproject.toml's)"
        required: true
        default: "0.1.0"
      prerelease:
        description: "Mark as a pre-release (beta)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$v" = "${{ inputs.version }}" || { echo "pyproject.toml says $v"; exit 1; }
          grep -q "__version__ = \"$v\"" relic/__init__.py
          test -f "docs/releases/$v.md"
          ! git ls-remote --exit-code --tags origin "v$v"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/relic info /bin/ls
          /tmp/v/bin/relic decompile /bin/true > /dev/null
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ inputs.version }}
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; title="Relic $v (beta)"; else title="Relic $v"; fi
          gh release create "v$v" dist/* --target "$GITHUB_SHA" --title "$title" \
            --notes-file "docs/releases/$v.md" $flags
