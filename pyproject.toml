[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relic-re"
version = "0.1.0"
description = "Relic - a GUI decompiler & disassembler for reverse engineering and pwnable"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "capstone>=5.0",
    "pyelftools>=0.29",
    "pefile>=2023.2.7",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
relic = "relic.__main__:main"

[tool.setuptools.packages.find]
include = ["relic*"]
