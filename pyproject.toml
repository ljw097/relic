[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relic-re"
version = "0.1.0"
description = "Relic - a GUI decompiler & disassembler for reverse engineering and pwnable"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "capstone>=5.0",
    "pyelftools>=0.29",
    "pefile>=2023.2.7",
    # PySide6 6.12.0 drops a reference to None on every void method call; before Python 3.12
    # None is not immortal, so a GUI session eventually frees it and aborts
    "PySide6>=6.5,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
relic = "relic.__main__:main"

[tool.setuptools.packages.find]
include = ["relic*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/bins"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E701",   # `if x: return y` on one line is used for short guards
    "E731",   # small named lambdas as local helpers
    "B023",   # closures over loop variables are called within the same iteration
    "B905",   # zip() strictness: lengths are equal by construction
]

[tool.ruff.lint.per-file-ignores]
"tests/test_flow.py" = ["E501"]   # C test harness embedded in a string
